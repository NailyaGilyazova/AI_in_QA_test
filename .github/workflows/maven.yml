name: AI QA Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build project
        run: mvn --batch-mode --no-transfer-progress clean compile

      - name: Run AI QA pipeline
        env:
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
        run: |
          mkdir -p generated
          mvn --batch-mode --no-transfer-progress exec:java -Dexec.mainClass=pipeline.PipelineMain

      - name: Upload AI artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-qa-artifacts
          if-no-files-found: warn
          path: |
            generated/
            src/test/java/org/demo/generated/
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
